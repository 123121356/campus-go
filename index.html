<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>캠퍼스GO · 강원대 삼척캠퍼스 AI 비서</title>
  <meta name="description" content="강원대학교 삼척캠퍼스 AI 비서: 강의실 길안내, 개인 시간표, 학교 공지·장학금·학사일정, 학식·혼잡도, 커뮤니티, 오늘의 대시보드" />
  <meta name="theme-color" content="#1d4ed8" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="styles.css?v=23" />
  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
  </script>
  <script>
    // 첫 화면 깜빡임 방지: 저장된 테마를 CSS보다 먼저 적용
    try { var t = JSON.parse(localStorage.getItem("cg_theme")); if (t === "dark" || t === "light") document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">GO</span>
      <div>
        <strong>캠퍼스GO</strong>
        <small>강원대 삼척캠퍼스</small>
      </div>
    </div>
    <div class="search">
      <input id="q" type="search" placeholder="어디를 찾으세요? (예: ATM, 프린터, 5공학관)" autocomplete="off" aria-label="건물 검색" />
      <ul id="suggest" class="suggest" hidden></ul>
    </div>
    <button id="langBtn" class="icon-btn" aria-label="언어 선택" title="언어 선택 (번역)">🌐</button>
    <button id="themeBtn" class="icon-btn" aria-label="다크 모드로 전환"></button>
    <button id="locate" class="icon-btn" title="내 위치 (지도 길게 누르기·우클릭으로 직접 지정)" aria-label="내 위치">◎</button>
  </header>

  <main class="layout">
    <section class="panel" id="panel">
      <div class="grip" id="grip" aria-hidden="true"></div>
      <nav class="tabs" role="tablist">
        <button role="tab" data-tab="buildings" class="active">건물</button>
        <button role="tab" data-tab="bus">버스</button>
        <button class="panel-close" id="panelClose" aria-label="패널 숨기기" title="패널 숨기기">✕</button>
      </nav>

      <!-- 건물 -->
      <div class="tab-body" id="tab-buildings">
        <div class="welcome">
          <b>처음 오셨나요?</b> 찾는 곳을 누르면 지도에 표시해 드려요.
          <div class="quickfind" id="quickFind">
            <button data-q="식당">🍚 식당</button>
            <button data-q="ATM">🏧 ATM</button>
            <button data-q="프린터">🖨 프린터·복사</button>
            <button data-q="편의점">🏪 편의점</button>
            <button data-q="카페">☕ 카페</button>
            <button data-q="열람실">📚 공부할 곳</button>
            <button data-q="기숙사">🏠 기숙사</button>
            <button data-q="bus">🚌 버스</button>
          </div>
          <button class="ghost gate" id="gateBtn">🚪 정문은 어디?</button>
        </div>
        <div id="detail" class="detail" hidden></div>
        <div class="chips" id="cats"></div>
        <ul id="blist" class="blist"></ul>
        <div class="editbar">
          <label class="switch"><input type="checkbox" id="editMode" /> 위치 편집 모드</label>
          <button id="exportJson" class="ghost" hidden>JSON 내보내기</button>
          <button id="exportIllo" class="ghost" hidden>조감도 좌표 내보내기</button>
          <button id="loadOsm" class="ghost">OSM 건물 불러오기</button>
        </div>
        <p class="hint" id="osmStatus"></p>
      </div>

      <!-- 버스 -->
      <div class="tab-body" id="tab-bus" hidden>
        <div class="bus-head">
          <div>
            <h3 id="stopName">강원대 후문 정류장</h3>
            <p class="muted" id="busMode"></p>
          </div>
          <button id="busRefresh" class="ghost">새로고침</button>
        </div>
        <div class="seg" id="busDirs" role="group" aria-label="방향">
          <button data-dir="donghae" class="on">동해 방면</button>
          <button data-dir="samcheok">삼척 시내 방면</button>
        </div>
        <ul id="arrivals" class="arrivals"></ul>
        <label class="switch" style="font-size:13px"><input type="checkbox" id="busHoliday" /> 오늘 공휴일이에요 (주말·공휴일 미운행 편 제외)</label>
        <h4>오늘 전체 시간표 <small class="muted">(후문 도착 추정)</small></h4>
        <div id="busTable" class="tt-grid"></div>
        <h4>노선</h4>
        <ul id="routes" class="routes"></ul>
        <details id="shuttle" class="shuttle-box"></details>
        <p class="hint" id="busSrc"></p>
      </div>

      <!-- 날씨 -->
      <div class="tab-body" id="tab-weather" hidden>
        <div class="bus-head">
          <div><h3>삼척캠퍼스 날씨</h3><p class="muted">캠퍼스 좌표 기준 예보</p></div>
          <button id="wxRefresh" class="ghost">새로고침</button>
        </div>
        <div id="wxNow"></div>
        <ul id="wxAdvice" class="wx-advice"></ul>
        <h4>앞으로 12시간</h4>
        <div id="wxHours" class="wx-hours"></div>
        <p class="hint" id="wxSrc"></p>
      </div>

    </section>

    <div class="map-wrap">
      <div class="view-toggle" role="group" aria-label="지도 보기 방식">
        <button data-view="map" class="on">지도</button>
        <button data-view="illo">조감도</button>
        <button data-view="3d">3D</button>
      </div>
      <button id="wxChip" class="wx-chip" hidden aria-label="비 예보"></button>
      <button id="panelOpen" class="panel-open" hidden>☰ 목록</button>
      <div id="pinBar" class="mapbar" hidden><span></span><button aria-label="표시 지우기">✕</button></div>
      <div id="routeBar" class="mapbar route" hidden><span></span><button id="routeFrom" class="from">출발지 바꾸기</button><button class="x" aria-label="경로 지우기">✕</button></div>
      <div id="pickBar" class="mapbar pick" hidden><span></span><button aria-label="취소">✕</button></div>
      <div id="map" class="map" role="region" aria-label="캠퍼스 지도"></div>
      <div id="illo" class="map illo" role="region" aria-label="캠퍼스 조감도" hidden></div>
      <div id="view3d" class="map view3d" role="region" aria-label="3D 캠퍼스" hidden></div>
    </div>
  </main>


  <!-- 건물 내부: 층별 사진 뷰어 -->
  <div id="viewer" class="viewer" hidden role="dialog" aria-modal="true" aria-labelledby="vTitle">
    <div class="v-box">
      <header class="v-head">
        <h3 id="vTitle"></h3>
        <button id="vClose" class="icon-btn" aria-label="닫기">✕</button>
      </header>
      <div class="v-body">
        <aside class="v-side">
          <div id="vStack" class="stack" aria-label="층 선택"></div>
          <p class="hint">층을 눌러 보세요 · ↑↓ 층 이동, ←→ 사진 넘기기</p>
        </aside>
        <section class="v-main">
          <nav id="vFloors" class="v-floors"></nav>
          <div class="v-floor-name" id="vFloorName"></div>
          <div class="v-stage" id="vStage">
            <img id="vImg" alt="" />
            <div id="vEmpty" class="v-empty" hidden>이 층은 사진 준비 중이에요</div>
            <button id="vPrev" class="v-nav prev" aria-label="이전 사진">‹</button>
            <button id="vNext" class="v-nav next" aria-label="다음 사진">›</button>
            <span id="vCount" class="v-count"></span>
          </div>
          <div class="v-cap" id="vCap"></div>
          <div id="vThumbs" class="v-thumbs"></div>
        </section>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="translate.js?v=1"></script>
  <script src="app.js?v=41" type="module"></script>
</body>
</html>
