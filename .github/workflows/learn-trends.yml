# 요즘 화제 학습 — 6시간마다 커뮤니티·검색 트렌드를 모아 AI가 NPC 대사로 정리하고 data/trends.json 을 커밋합니다.
# 커밋되면 Vercel 이 다시 배포되어 3D NPC·AI 요정이 바로 새 화제를 말합니다.
# 준비: GitHub 저장소 → Settings → Secrets and variables → Actions 에
#   GEMINI_API_KEY (필수 권장), YOUTUBE_API_KEY, NAVER_CLIENT_ID, NAVER_CLIENT_SECRET (선택)
# 참고: 디시인사이드가 GitHub 서버 IP를 막으면 그 출처만 건너뛰고 나머지로 학습합니다.
name: 요즘 화제 학습

on:
  schedule:
    - cron: "17 */6 * * *" # 6시간마다 (한국 03:17, 09:17, 15:17, 21:17)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: learn-trends
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 수집 → 거르기 → AI 정리 → 누적
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: node tools/learn-trends.mjs
      - name: 바뀐 데이터 커밋
        run: |
          git config user.name "campusgo-bot"
          git config user.email "campusgo-bot@users.noreply.github.com"
          git add data/trends.json
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "요즘 화제 학습: $(TZ=Asia/Seoul date '+%F %H시')"
          git pull --rebase origin main
          git push origin HEAD:main
